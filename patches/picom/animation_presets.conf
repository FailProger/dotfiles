appear = {
    opacity = {
        duration = "placeholder0";
        start = "placeholder2";
        end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
        curve = "cubic-bezier(0.24, 0.64, 0.79, 0.98)";
        duration = "placeholder0";
        start = "placeholder1";
        end = 1;
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";

    # See comments in tools/animgen.c for syntax
    *knobs = {
        scale = 0.95;
        duration = 0.2;
        start-opacity = 0;
    };
    *placeholders = (
        (0, "duration"),
        (1, "scale"),
        (2, "start-opacity")
    );
};

disappear = {
    opacity = {
        duration = "placeholder0";
        start = "window-raw-opacity-before";
        end = "window-raw-opacity";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    offset-x = "(1 - scale-x) / 2 * window-width";
    offset-y = "(1 - scale-y) / 2 * window-height";
    scale-x = {
        curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        duration = "placeholder0";
        start = 1;
        end = "placeholder1";
    };
    scale-y = "scale-x";
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    *knobs = {
        scale = 0.95;
        duration = 0.2;
    };
    *placeholders = ((0, "duration"),(1, "scale"));
};

slide-in = {
    v-timing = {
        curve = "cubic-bezier(0.24, 0.64, 0.79, 0.98)";
        start = "window-width * placeholder1 + window-height * placeholder2";
        duration = "placeholder0";
        end = 0;
    };
    offset-x = "v-timing * placeholder3";
    offset-y = "v-timing * (1 - placeholder3)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    crop-x = "window-x";
    crop-y = "window-y";
    crop-width = "window-width";
    crop-height = "window-height";
    *knobs = {
        duration = 0.2;
        direction = (2, ["up", "down", "left", "right"]);
    };
    *placeholders = (
        (0, "duration"),
        (1, "direction", [0, 0, -1, 1]),
        (2, "direction", [-1, 1, 0, 0]),
        (3, "direction", [0, 0, 1, 1]),
    );
};

slide-out = {
    v-timing = {
        curve = "cubic-bezier(0.21, 0.02, 0.76, 0.36)";
        start = 0;
        duration = "placeholder0";
        end = "window-width * placeholder1 + window-height * placeholder2";
    };
    offset-x = "v-timing * placeholder3";
    offset-y = "v-timing * (1 - placeholder3)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    crop-x = "window-x";
    crop-y = "window-y";
    crop-width = "window-width";
    crop-height = "window-height";
    opacity = {
        start = "window-raw-opacity-before";
        end = "window-raw-opacity-before";
        duration = "placeholder0";
    };
    blur-opacity = "opacity";
    shadow-opacity = "opacity";
    *knobs = {
        duration = 0.2;
        direction = (2, ["up", "down", "left", "right"]);
    };
    *placeholders = (
        (0, "duration"),
        (1, "direction", [0, 0, -1, 1]),
        (2, "direction", [-1, 1, 0, 0]),
        (3, "direction", [0, 0, 1, 1]),
    );
};

geometry-change = {
    scale-x = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-width-before / window-width";
        end = 1;
    };
    scale-y = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-height-before / window-height";
        end = 1;
    };
    shadow-scale-x = "scale-x";
    shadow-scale-y = "scale-y";
    offset-x = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-x-before - window-x";
        end = 0;
    };
    offset-y = {
        curve = "cubic-bezier(0.07, 0.65, 0, 1)";
        duration = "placeholder0";
        start = "window-y-before - window-y";
        end = 0;
    };
    saved-image-blend = {
        duration = "placeholder0";
        start = 1;
        end = 0;
    };
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    *knobs = {
        duration = 0.4;
    };
    *placeholders = ((0, "duration"));
};

workspace-slide-in = {
    saved-opacity = { duration = "placeholder0"; start = "window-raw-opacity"; end = "window-raw-opacity"; };
    saved-blur-opacity = { duration = "placeholder0"; start = "window-blur-opacity"; end = "window-blur-opacity"; };
    t = {
        curve = "linear";
        duration = "placeholder0";
        start = 0;
        end = 1;
    };
    y = "1.5*t - 0.5*t^3";
    offset-x = "placeholder1 * (window-monitor-width / 4 - window-monitor-width / 4 * y)";
    offset-y = "placeholder2 * (window-monitor-height / 4 - window-monitor-height / 4 * y)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    opacity = "placeholder3 + y * (saved-opacity - placeholder3)";
    blur-opacity = "placeholder3 + y * (saved-blur-opacity - placeholder3)";
    shadow-opacity = "placeholder3 + y * (1 - placeholder3)";
    *knobs = {
        duration = 0.2;
        direction = (2, ["up", "down", "left", "right"]);
        start-opacity = 0;
    };
    *placeholders = (
        (0, "duration"),
        (1, "direction", [0, 0, 1, -1]),
        (2, "direction", [1, -1, 0, 0]),
        (3, "start-opacity")
    );
};

workspace-slide-out = {
    saved-opacity = { duration = 0.0001; start = "window-raw-opacity-before"; end = "window-raw-opacity-before"; };
    saved-blur-opacity = { duration = 0.0001; start = "window-blur-opacity-before"; end = "window-blur-opacity-before"; };
    t = {
        curve = "linear";
        duration = "placeholder0";
        start = 0;
        end = 1;
    };
    y = "1.5*t - 0.5*t^3";
    offset-x = "placeholder1 * ( - window-monitor-width / 4 * y)";
    offset-y = "placeholder2 * ( - window-monitor-height / 4 * y)";
    shadow-offset-x = "offset-x";
    shadow-offset-y = "offset-y";
    opacity = "saved-opacity - saved-opacity * y";
    blur-opacity = "saved-blur-opacity - saved-blur-opacity * y";
    shadow-opacity = "1 - y";
    *knobs = {
        duration = 0.2;
        direction = (2, ["up", "down", "left", "right"]);
    };
    *placeholders = (
        (0, "duration"),
        (1, "direction", [0, 0, 1, -1]),
        (2, "direction", [1, -1, 0, 0])
    );
};
