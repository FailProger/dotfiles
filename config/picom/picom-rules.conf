rules = (
    # --- GENERAL ---

    {
        # Unfocused opacity
        match = "!focused";
        opacity = 0.8;
    },


    # --- EXCLUDES ---

    {
        # Corners
        match =
            "class_g = 'dmenu' ||"
            "class_g = 'i3lock' ||"
            "fullscreen";
        corner-radius = 0;
    }, {
        # Shadows
        match =
            "class_g = 'dwm' ||"
            "class_g = 'Aimp'";
        shadow = false;
    }, {
        # Opacity
        match =
            "class_g = 'dwm' ||"
            "class_g = 'dmenu' ||"
            "class_g = 'i3lock' ||"
            "role = 'Popup'";
        opacity = 1;
    },


    # --- SPECIFIC ---

    {
        # dwm
        match = "class_g = 'dwm'";
        corner-radius = 6;
        blur-opacity = 0.9;
        animations = (
            { triggers = [ "open", "show" ] },
            { triggers = [ "close", "hide" ] }
        );
    },
    {
        #dmenu
        match = "class_g = 'dmenu'";
        animations = ({
            triggers = [ "open", "show" ];
            suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
            preset = "slide-in";
            duration = 0.15;
            direction = "up";
        }, {
            triggers = [ "close", "hide" ];
            suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
            preset = "slide-out";
            duration = 0.15;
            direction = "up";
        });
    },
    {
        # AIMP
        match = "class_g = 'Aimp' && focused";
        blur-opacity = 0;
    }
);
