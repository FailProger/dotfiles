animations = (
    # --- OPEN ---

    {
        triggers = [ "open", "show" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "appear";
        duration = 0.2;
        start-opacity = 0.4;
    },


    # --- CLOSE ---

    {
        triggers = [ "close", "hide" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "disappear";
        duration = 0.2;
    },


    # --- GEOMETRY ---

    {
        triggers = [ "geometry" ];
        suppressions = [ "increase-opacity", "decrease-opacity" ];
        preset = "geometry-change";
        duration = 0.2;
    },


    # --- WORKSPACE SWITCH ---

    {
        triggers = [ "workspace-in" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "workspace-slide-in";
        duration = 0.2;
        direction = "left";
        start-opacity = 0.4;
    }, {
        triggers = [ "workspace-out" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "workspace-slide-out";
        duration = 0.2;
        direction = "left";
    }, {
        triggers = [ "workspace-in-inverse" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "workspace-slide-in";
        duration = 0.2;
        direction = "right";
        start-opacity = 0.4;
    }, {
        triggers = [ "workspace-out-inverse" ];
        suppressions = [ "increase-opacity", "decrease-opacity", "geometry" ];
        preset = "workspace-slide-out";
        duration = 0.2;
        direction = "right";
    }
);
