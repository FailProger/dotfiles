# --- GENERAL ---

backend = "glx";
vsync = true;
xrender-sync-fence = true;


# --- CORNERS ---

corner-radius = 10;


# --- SHADOWS ---

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.5;
shadow-offset-x = -16;
shadow-offset-y = -12;


# --- BLUR ---

blur = {
    method = "dual_kawase";
    strength = 10;
}


# --- ANIMATIONS ---

@include "./picom-animations.conf"


# --- RULES ---

@include "./picom-rules.conf"
