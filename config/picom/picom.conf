# --- SETTINGS ---
backend = "glx";
vsync = true;

# --- ANIMATION ---
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;

# --- OPACITY ---
inactive-opacity = 0.8;

opacity-rule = [
  "100:class_g = 'dmenu'",
  "100:class_g = 'i3lock'",
  "100:role = 'Popup'"
];

# --- BLUR ---
blur-background = false;
blur-method = "dual_kawase";

