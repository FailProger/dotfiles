Define.SplitPCMPeriodTime 2666
Define.SplitPCMBufferTime 10666

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "e2x2_out"
			Direction Playback
			Format S32_LE
			Channels 2
			HWChannels 8
			HWChannelPos0 FL
			HWChannelPos1 FR
			HWChannelPos2 FL
			HWChannelPos3 FR
			HWChannelPos4 FL
			HWChannelPos5 FR
			HWChannelPos6 FL
			HWChannelPos7 FR
		}
	}
	{
		SplitPCM {
			Name "e2x2_in_mono"
			Direction Capture
			Format S32_LE
			Channels 1
			HWChannels 10
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
		}
	}
	{
		SplitPCM {
			Name "e2x2_in_stereo"
			Direction Capture
			Format S32_LE
			Channels 2
			HWChannels 10
			HWChannelPos0 MONO
			HWChannelPos1 MONO
			HWChannelPos2 MONO
			HWChannelPos3 MONO
			HWChannelPos4 MONO
			HWChannelPos5 MONO
			HWChannelPos6 MONO
			HWChannelPos7 MONO
			HWChannelPos8 MONO
			HWChannelPos9 MONO
		}
	}
]

Include.ctl_remap.File "/common/ctl/remap.conf"

Macro [
	{ CtlRemapStereoVolSw { Dst "System 1/2" Src "E2x2 OTG Playback" Index0 0 Index1 1 } }
	{ CtlRemapStereoVolSw { Dst "Music 3/4" Src "E2x2 OTG Playback" Index0 2 Index1 3 } }
	{ CtlRemapStereoVolSw { Dst "DAW 5/6" Src "E2x2 OTG Playback" Index0 4 Index1 5 } }
	{ CtlRemapStereoVolSw { Dst "Voice Chat 7/8" Src "E2x2 OTG Playback" Index0 6 Index1 7 } }

	{ CtlRemapMonoVolSw { Dst "Analog 1" Src "Mic Capture" Index 0 } }
	{ CtlRemapMonoVolSw { Dst "Analog 2" Src "Mic Capture" Index 1 } }
	{ CtlRemapStereoVolSw { Dst "Loopback 1/2" Src "Mic Capture" Index0 4 Index1 5 } }
	{ CtlRemapStereoVolSw { Dst "Loopback 3/4" Src "Mic Capture" Index0 6 Index1 7 } }
	{ CtlRemapStereoVolSw { Dst "Loopback 5/6" Src "Mic Capture" Index0 8 Index1 9 } }
]

SectionVerb {
	EnableSequence [
		cset "name='E2x2 OTG Playback Switch' on,on,on,on,on,on,on,on"
		cset "name='E2x2 OTG Playback Volume' 100%,100%,100%,100%,100%,100%,100%,100%"
		cset "name='E2x2 OTG Playback Switch',index=1 on"
		cset "name='E2x2 OTG Playback Volume',index=1 100%"
		cset "name='Mic Capture Switch' on,on,on,on,on,on,on,on,on,on"
		cset "name='Mic Capture Volume' 100%,100%,100%,100%,100%,100%,100%,100%,100%,100%"
		cset "name='Mic Capture Switch',index=1 on"
		cset "name='Mic Capture Volume',index=1 100%"
	]
}

SectionDevice."Line1" {
	Comment "System 1/2"

	Value {
		PlaybackPriority 400
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "System"
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "e2x2_out"
		Direction Playback
		Device 0
		HWChannels 8
		Channels 2
		Channel0 0
		Channel1 1
		ChannelPos0 FL
		ChannelPos1 FR
	}
}

